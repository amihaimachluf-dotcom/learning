<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לומדים בקלות</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Assistant:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   DESIGN SYSTEM — tokens
   ========================================================= */
:root{
  --bg:#F4F2EE; --surface:#FFFFFF; --surface-2:#F9F7F3;
  --ink:#2F3437; --ink-soft:#6B7176; --line:#E6E1D8;
  --sage:#7FA391; --sage-soft:#E3EDE7;
  --sky:#7D98B3; --sky-soft:#E3EAF1;
  --peach:#D99C7E; --peach-soft:#F6E7DE;
  --good:#5E9C7A; --bad:#C0766A;
  --shadow:0 2px 14px rgba(60,55,45,.06);
  /* spacing */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  /* radius */
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  /* type */
  --f-head:'Rubik',sans-serif; --f-body:'Assistant','Rubik',sans-serif;
  --t-xs:13px; --t-sm:14.5px; --t-md:16px; --t-lg:18px; --t-xl:22px; --t-2xl:27px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1D2023; --surface:#262A2E; --surface-2:#2C3136;
    --ink:#E9E6E0; --ink-soft:#A4A9AD; --line:#383E44;
    --sage:#8DB5A1; --sage-soft:#2E3B35; --sky:#93AECA; --sky-soft:#2D3642;
    --peach:#E0AC90; --peach-soft:#3E3330; --good:#7DBB98; --bad:#D98E83;
    --shadow:0 2px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#1D2023; --surface:#262A2E; --surface-2:#2C3136;
  --ink:#E9E6E0; --ink-soft:#A4A9AD; --line:#383E44;
  --sage:#8DB5A1; --sage-soft:#2E3B35; --sky:#93AECA; --sky-soft:#2D3642;
  --peach:#E0AC90; --peach-soft:#3E3330; --good:#7DBB98; --bad:#D98E83;
  --shadow:0 2px 14px rgba(0,0,0,.25);
}

/* =========================================================
   DESIGN SYSTEM — base + components
   ========================================================= */
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);line-height:1.35;margin:0}
.app{max-width:680px;margin:0 auto;padding:var(--s5) var(--s4) 120px}
.muted{color:var(--ink-soft)}
.small{font-size:var(--t-sm)}
.stack>*+*{margin-top:var(--s3)}
.gap{height:var(--s5)}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s5);min-height:44px}
.brand{font-family:var(--f-head);font-weight:600;color:var(--ink-soft)}
.icon-btn{background:none;border:none;font-size:20px;cursor:pointer;padding:6px;border-radius:var(--r-sm)}
.back{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 14px;font-size:15px;cursor:pointer}

/* card */
.card{background:var(--surface);border-radius:var(--r-lg);padding:var(--s5);box-shadow:var(--shadow)}
.card+.card{margin-top:var(--s3)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin-bottom:var(--s3)}
.card-h h2{font-size:var(--t-lg);font-weight:600}
.label{font-size:var(--t-xs);color:var(--ink-soft);font-weight:600;margin-bottom:var(--s1)}
.tint-sage{background:var(--sage-soft)} .tint-sky{background:var(--sky-soft)} .tint-peach{background:var(--peach-soft)}

/* buttons */
.btn{border:none;border-radius:var(--r-md);padding:13px 18px;font-size:var(--t-md);font-weight:600;cursor:pointer;font-family:var(--f-head);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.block{width:100%}
.btn.primary{background:var(--sage);color:#fff}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.soft{background:var(--surface-2);border:1px solid var(--line);font-weight:500}
.btn.sm{padding:8px 12px;font-size:var(--t-sm);border-radius:var(--r-sm)}
.btn:disabled{opacity:.45;cursor:default}
.row-btns{display:flex;gap:var(--s2);flex-wrap:wrap}
.row-btns .btn{flex:1}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* forms */
.field{display:block;margin-bottom:var(--s4)}
.field span{display:block;font-size:var(--t-sm);font-weight:600;margin-bottom:6px}
.field small{display:block;color:var(--ink-soft);font-size:var(--t-xs);margin-top:4px}
input[type=text],input[type=date],textarea{width:100%;background:var(--surface-2);border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px 14px;line-height:1.5}
textarea{min-height:88px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--sky)}
.choices{display:grid;gap:var(--s2)}
.choice{background:var(--surface-2);border:1.5px solid var(--line);border-radius:var(--r-md);padding:13px 16px;text-align:right;cursor:pointer}
.choice.on{border-color:var(--sage);background:var(--sage-soft)}

/* check rows */
.check{display:flex;align-items:flex-start;gap:var(--s3);padding:10px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:none}
.tick{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:var(--surface);flex-shrink:0;cursor:pointer;display:grid;place-items:center;color:#fff;font-size:15px;margin-top:2px}
.tick.on{background:var(--sage);border-color:var(--sage)}
.check .txt{flex:1}
.check.done .txt{color:var(--ink-soft);text-decoration:line-through}

/* big move */
.bigmove{display:flex;gap:var(--s3);align-items:flex-start}
.bigmove .txt{font-family:var(--f-head);font-size:var(--t-lg);font-weight:600;line-height:1.45;flex:1}
.bigmove.done .txt{text-decoration:line-through;color:var(--ink-soft)}
.bigmove .tick{width:34px;height:34px;border-radius:11px}

/* progress */
.bar{height:7px;background:var(--line);border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage);border-radius:7px;transition:width .4s}
.stats{display:flex;gap:var(--s2)}
.stat{flex:1;background:var(--surface);border-radius:var(--r-md);padding:var(--s3);box-shadow:var(--shadow);text-align:center}
.stat b{display:block;font-family:var(--f-head);font-size:var(--t-xl);font-weight:600}
.stat small{color:var(--ink-soft);font-size:var(--t-xs)}
.pill{display:inline-block;border-radius:var(--r-pill);padding:2px 10px;font-size:var(--t-xs);font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-soft)}
.pill.ai{background:var(--sky-soft);border-color:transparent;color:var(--sky)}

/* ai box */
.ai-out{white-space:pre-wrap;background:var(--sky-soft);border-radius:var(--r-md);padding:var(--s4);font-size:var(--t-md)}
.notice{background:var(--peach-soft);border-radius:var(--r-md);padding:var(--s3) var(--s4);font-size:var(--t-sm)}

/* onboarding */
.ob{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
.dots{display:flex;gap:6px;margin-bottom:var(--s6)}
.dots i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.dots i.on{background:var(--sage)}
.ob h1{font-size:var(--t-2xl);font-weight:700;margin-bottom:var(--s2)}
.ob p.hint{color:var(--ink-soft);margin:0 0 var(--s5)}

/* segmented + slider */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg-b{background:var(--surface-2);border:1.5px solid var(--line);border-radius:var(--r-pill);padding:7px 14px;cursor:pointer;font-size:var(--t-sm)}
.seg-b.on{background:var(--sage);border-color:var(--sage);color:#fff}
.slider{display:grid;grid-template-columns:1fr 1.3fr 28px;align-items:center;gap:10px;margin-bottom:10px;font-size:var(--t-sm)}
.slider span{font-weight:600}
.slider input{width:100%;accent-color:var(--sage)}
.slider b{font-family:var(--f-head);text-align:center}

/* list rows */
.lrow{display:flex;align-items:center;gap:var(--s3);background:var(--surface);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;width:100%;text-align:right;border:1px solid transparent}
.lrow:hover{border-color:var(--line)}
.lrow+.lrow{margin-top:var(--s2)}
.lrow .grow{flex:1;min-width:0}
.lrow b{display:block;font-family:var(--f-head);font-weight:500}
.num{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-head);font-weight:600;flex-shrink:0;background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}
.num.on{background:var(--sage);color:#fff;border-color:var(--sage)}
.t-icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex-shrink:0}

/* lesson reader */
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.steps i.on{background:var(--sage)}
.lesson h2{font-size:var(--t-xl);font-weight:600;margin-bottom:14px}
.lesson p{margin:0 0 14px}
.lead{background:var(--sage-soft);border-radius:14px;padding:14px 16px;font-weight:500;margin-bottom:16px}
.callout{background:var(--peach-soft);border-radius:14px;padding:14px 16px;margin:14px 0}
.callout b{display:block;font-family:var(--f-head);font-weight:600;margin-bottom:2px}
.lesson ul,.lesson ol{padding-right:22px;margin:0 0 14px}
.lesson li{margin-bottom:8px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;margin:14px 0}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:360px}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line)}
th{background:var(--surface-2);font-family:var(--f-head);font-weight:500;font-size:14px;color:var(--ink-soft)}
tr:last-child td{border-bottom:none}
tr.total td{font-weight:700}
pre{direction:ltr;text-align:left;background:var(--surface-2);border-radius:12px;padding:12px 16px;font-size:14px;overflow-x:auto;color:var(--ink-soft)}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;text-align:right;cursor:pointer}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nav-in{display:flex;max-width:680px;width:100%}
.nav button{flex:1;background:none;border:none;padding:10px 4px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-soft);font-size:12.5px;font-weight:600}
.nav button .ic{font-size:21px;line-height:1}
.nav button.on{color:var(--sage)}

/* toast */
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:var(--r-pill);font-size:var(--t-sm);font-weight:600;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" id="nav" hidden><div class="nav-in">
  <button data-a="go" data-v="today"><span class="ic">☀️</span>היום</button>
  <button data-a="go" data-v="goals"><span class="ic">🎯</span>יעדים</button>
  <button data-a="go" data-v="learn"><span class="ic">📚</span>לימוד</button>
  <button data-a="go" data-v="modules"><span class="ic">🧭</span>כלים</button>
  <button data-a="go" data-v="reflect"><span class="ic">🌙</span>ערב</button>
</div></nav>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONTENT — ספריית שיעורים
   ========================================================= */
const TOPICS = [
{
  id:'finance', icon:'💰', color:'sage',
  title:'חינוך פיננסי', desc:'דיור, תקציב, ילדים, רכב והשקעה ראשונה',
  lessons:[
  {
    title:'שכירות מול בעלות', mins:4,
    pages:[
      {h:'מה באמת עולה דירה?', blocks:[
        {t:'lead', v:'הפער האמיתי בין בעלות לשכירות בדוגמה הוא 3,250 ₪ בחודש — לא 1,500 ₪.'},
        {t:'p', v:'רוב האנשים משווים רק שכר דירה מול משכנתא, ושוכחים שבעלות מביאה איתה שורה של הוצאות שהשוכר לא רואה.'},
        {t:'table', head:['סעיף','שכירות','בעלות'], rows:[
          ['שכר דירה / משכנתא','6,000 ₪','7,500 ₪'],['ביטוח','0','250 ₪'],['ארנונה','400 ₪','400 ₪'],
          ['ועד בית ותחזוקה','600 ₪','1,200 ₪'],['גינון','0','200 ₪'],['תיקונים','0','400 ₪']],
          total:['סה"כ לחודש','7,100 ₪','10,350 ₪']}
      ]},
      {h:'מה הטבלה לא מראה', blocks:[
        {t:'ul', v:[
          '<b>חלק מהמשכנתא הוא חיסכון.</b> החזר הקרן נשאר שלכם בתוך הדירה.',
          '<b>עליית ערך.</b> מחירי הדירות עלו לאורך עשורים, בלי הבטחה להמשך.',
          '<b>עלות ההון העצמי.</b> שוכר יכול להשקיע את ההון העצמי בשוק ההון.']}
      ]},
      {h:'מתי לקנות ומתי לשכור', blocks:[
        {t:'p', v:'<b>קנייה מתאימה</b> כשגרים באזור 7–10 שנים לפחות, יש הון עצמי בלי לרוקן קרן חירום, וההחזר לא עובר שליש מההכנסה נטו.'},
        {t:'p', v:'<b>שכירות מתאימה</b> בתחילת הקריירה, בלי הון עצמי מספק, או כשאפשר להשקיע את ההפרש בעקביות.'},
        {t:'callout', h:'הכלל החשוב ביותר', v:'שכירות משתלמת רק אם את ההפרש באמת חוסכים ומשקיעים.'}
      ]}
    ],
    quiz:[
      {q:'מה הפער החודשי האמיתי בין בעלות לשכירות בדוגמה?', o:['1,500 ₪','3,250 ₪','7,100 ₪'], a:1, why:'10,350 פחות 7,100 = 3,250 ₪.'},
      {q:'מתי שכירות באמת משתלמת?', o:['תמיד','כשמשקיעים את ההפרש','כשהדירה גדולה'], a:1, why:'בלי השקעת ההפרש, היתרון נעלם.'}
    ]
  },
  {
    title:'חוק השלישים לילדים', mins:3,
    pages:[
      {h:'שלושה חלקים שווים', blocks:[
        {t:'lead', v:'כל שקל שהילד מקבל מתחלק לשלושה: חיסכון, הנאה ונתינה.'},
        {t:'table', head:['חלק','ייעוד','מה לומדים'], rows:[
          ['שליש','חיסכון והשקעה','דחיית סיפוקים'],['שליש','הנאה אישית','חופש בחירה ואחריות'],['שליש','נתינה','אמפתיה ומעורבות']]},
        {t:'p', v:'בשליש של ההנאה — לא מתערבים. הטעויות הקטנות בגיל 8 חוסכות טעויות גדולות בגיל 28.'}
      ]},
      {h:'איך מיישמים בבית', blocks:[
        {t:'ul', v:[
          '<b>שלוש צנצנות שקופות</b> — "חוסך", "נהנה", "נותן".',
          '<b>"הריבית של אבא ואמא"</b> — שקל בונוס על כל 10 ₪ שנשארו חודש.',
          '<b>מטרת חיסכון ממשית</b> — הילד מחשב לבד כמה שבועות עד המשחק.',
          '<b>נתינה בבחירה שלו</b> — הוא בוחר למי לתרום.',
          '<b>בגיל העשרה</b> — כרטיס נטען עם תקציב. נגמר? לא משלימים.',
          '<b>אתם הדוגמה</b> — ילדים מחקים את מה שהם שומעים בבית.']}
      ]}
    ],
    quiz:[
      {q:'איזה חלק מלמד דחיית סיפוקים?', o:['הנאה','חיסכון','נתינה'], a:1, why:'לוותר על משהו קטן היום בשביל משהו גדול מחר.'},
      {q:'מה עושים כשהילד "מבזבז" את שליש ההנאה על משהו מיותר?', o:['מתערבים','לא מתערבים','לוקחים לו את הכסף'], a:1, why:'הטעות הקטנה היא חלק מהלמידה.'}
    ]
  },
  {
    title:'כלל התקציב 50/30/20', mins:4,
    pages:[
      {h:'חלוקת ההכנסה', blocks:[
        {t:'lead', v:'חצי לצרכים, 30% לרצונות, ולפחות 20% לחיסכון.'},
        {t:'table', head:['קטגוריה','אחוז','ב־15,000 ₪'], rows:[
          ['צרכים','50%','7,500 ₪'],['רצונות','30%','4,500 ₪'],['חיסכון והשקעות','20%','3,000 ₪']]},
        {t:'callout', h:'לשכירים בישראל', v:'הפנסיה וקרן ההשתלמות כבר מופרשות מהמשכורת — אבל עדיין צריך קרן חירום נזילה.'}
      ]},
      {h:'סדר עדיפויות בחיסכון', blocks:[
        {t:'ol', v:['קרן חירום של 3–6 חודשי הוצאות.','סילוק חובות יקרים: מינוס, אשראי, קרדיט.','השקעה לטווח ארוך.']}
      ]},
      {h:'טיפים ומה עושים כשחורגים', blocks:[
        {t:'ul', v:[
          '<b>צרכים:</b> בדיקת ביטוחים פעם בשנה, השוואת סלולר, סופר לפי רשימה.',
          '<b>רצונות:</b> ניקוי מנויים ברבעון וכלל 48 השעות לקניות מעל 200 ₪.',
          '<b>חיסכון:</b> הוראת קבע ביום המשכורת.',
          '<b>צרכים מעל 50%?</b> עוברים זמנית ל־60/20/20, לא מוותרים על חיסכון.',
          '<b>חרגתם?</b> חוזרים לתקציב הרגיל בלי קיצוץ דרסטי.']}
      ]}
    ],
    quiz:[
      {q:'בהכנסה של 15,000 ₪ נטו, כמה לפחות לחסוך?', o:['1,500 ₪','3,000 ₪','4,500 ₪'], a:1, why:'20% מ־15,000 = 3,000 ₪.'},
      {q:'מה הדבר הראשון בסדר העדיפויות של החיסכון?', o:['השקעה במניות','קרן חירום','חופשה'], a:1, why:'קודם כרית ביטחון, אחר כך חובות, ורק אז השקעה.'}
    ]
  },
  {
    title:'מלכודת המכונית החדשה', mins:4,

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const dayKey = (d = new Date()) => { const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); };
const dayIndex = () => Math.floor(Date.now()/86400000);
const greet = () => { const h=new Date().getHours(); return h<5?'לילה טוב':h<12?'בוקר טוב':h<17?'צהריים טובים':h<21?'ערב טוב':'לילה טוב'; };
const heDate = () => new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
function confirmTap(el, label='לחץ שוב לאישור'){
  if (el.dataset.armed) return true;
  el.dataset.armed = '1'; const old = el.textContent; el.textContent = label;
  setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = old; } }, 3000);
  return false;
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2000); }

/* =========================================================
   DATA LAYER — store (db פרטי + גיבוי בדפדפן)
   ========================================================= */
const Store = (() => {
  const LS = 'sos-v1';
  const fresh = () => ({ v:1, profile:null, goals:[], days:{}, lessons:{}, xp:0, xpKeys:{}, updatedAt:0 });
  let state = fresh(), ref = null, t = null, remote = 'local';

  function loadLocal(){
    try { const s = JSON.parse(localStorage.getItem(LS)); if (s) state = Object.assign(fresh(), s); } catch(e) {}
    try { const old = JSON.parse(localStorage.getItem('learn-progress-v1') || '{}'); for (const k in old) if (old[k]) state.lessons[k] = true; } catch(e) {}
  }
  async function connect(onChange){
    try {
      if (!window.claude || !claude.use) return;
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      const id = user ? await user.id() : null;
      if (!db || !id) return;
      ref = db.doc('data/users/' + id + '/state');
      const snap = await ref.get();
      if (snap.exists) {
        const r = JSON.parse(JSON.stringify(snap.data()));
        if ((r.updatedAt || 0) > (state.updatedAt || 0)) { state = Object.assign(fresh(), r); writeLocal(); onChange(); }
        else if ((state.updatedAt||0) > (r.updatedAt||0)) await ref.set(state);
      } else if (state.updatedAt) { await ref.set(state); }
      remote = 'cloud';
    } catch(e) { ref = null; }
  }
  function writeLocal(){ try { localStorage.setItem(LS, JSON.stringify(state)); } catch(e) {} }
  function save(){
    state.updatedAt = Date.now();
    writeLocal();
    if (ref) { clearTimeout(t); t = setTimeout(() => ref.set(JSON.parse(JSON.stringify(state))).catch(()=>{}), 700); }
  }
  function reset(){ state = fresh(); save(); }
  return { get s(){ return state; }, loadLocal, connect, save, reset, get mode(){ return remote; } };
})();

/* =========================================================
   ENGINES — XP, יעדים, משימה יומית, רפלקציה
   ========================================================= */
const XP = {
  award(key, amount){ const s=Store.s; if (s.xpKeys[key]) return 0; s.xpKeys[key]=amount; s.xp += amount; return amount; },
  revoke(key){ const s=Store.s; const a=s.xpKeys[key]; if (!a) return; s.xp -= a; delete s.xpKeys[key]; },
  level(){ return Math.floor(Store.s.xp / 100) + 1; },
  inLevel(){ return Store.s.xp % 100; },
  streak(){
    const s=Store.s; let n=0; const d=new Date();
    const active = k => { const day=s.days[k]; return day && (day.done?.big || day.reflection); };
    if (!active(dayKey(d))) d.setDate(d.getDate()-1);
    while (active(dayKey(d))) { n++; d.setDate(d.getDate()-1); }
    return n;
  }
};

const Goals = {
  list(status){ return Store.s.goals.filter(g => !status || g.status === status); },
  get(id){ return Store.s.goals.find(g => g.id === id); },
  progress(g){ if (!g.milestones.length) return g.status==='done'?100:0; return Math.round(g.milestones.filter(m=>m.done).length / g.milestones.length * 100); },
  create(data){ const g = Object.assign({ id:uid(), title:'', why:'', deadline:'', current:'', desired:'', milestones:[], nextAction:'', status:'active', createdAt:Date.now() }, data); Store.s.goals.push(g); return g; },
  update(id, data){ Object.assign(Goals.get(id), data); },
  remove(id){ Store.s.goals = Store.s.goals.filter(g => g.id !== id); },
  toggleMilestone(id, i){
    const g = Goals.get(id); const m = g.milestones[i]; m.done = !m.done;
    if (m.done) XP.award('ms:'+id+':'+i, 25); else XP.revoke('ms:'+id+':'+i);
    if (g.milestones.length && g.milestones.every(x=>x.done)) { g.status='done'; XP.award('goal:'+id, 100); }
    else if (g.status==='done') g.status='active';
  },
  daysLeft(g){ if (!g.deadline) return null; return Math.ceil((new Date(g.deadline) - new Date(dayKey())) / 86400000); }
};

const Library = {
  nextLesson(){
    for (const t of TOPICS) { if (t.locked) continue;
      for (let i=0;i<t.lessons.length;i++) if (!Store.s.lessons[t.id+':'+i]) return { topicId:t.id, li:i, title:t.lessons[i].title, topic:t.title }; }
    return null;
  },
  complete(topicId, li){
    Store.s.lessons[topicId+':'+li] = true;
    XP.award('lesson:'+topicId+':'+li, 15);
    const day = Mission.day(); const m = day.mission;
    if (m && m.learning && m.learning.topicId===topicId && m.learning.li===li) Mission.setDone('learn', true);
  }
};

const Mission = {
  day(k = dayKey()){ const s=Store.s; if (!s.days[k]) s.days[k] = { mission:null, done:{}, reflection:null }; return s.days[k]; },
  yesterdayHint(){ const d=new Date(); d.setDate(d.getDate()-1); return Store.s.days[dayKey(d)]?.reflection?.tomorrow || ''; },
  template(){
    const s = Store.s, goals = Goals.list('active');
    const hint = Mission.yesterdayHint();
    const actions = goals.map(g => g.nextAction || (g.milestones.find(m=>!m.done)?.t) || ('צעד אחד קדימה ב"' + g.title + '"')).filter(Boolean);
    const big = hint || actions[0] || ('צעד אחד קדימה ב' + (s.profile?.change || 'יעד המרכזי שלך'));
    const pri = actions.filter(a => a !== big).slice(0,3);
    const fillers = ['לסגור עניין פתוח אחד שנדחה', 'לתכנן את הבלוק של מחר', 'לעבור על היעדים ולעדכן צעד הבא'];
    while (pri.length < 3) pri.push(fillers[pri.length]);
    return {
      bigMove: big, priorities: pri, habit: HABITS[dayIndex() % HABITS.length],
      learning: Library.nextLesson(), model: dayIndex() % MODELS.length,
      question: EVENING_QS[dayIndex() % EVENING_QS.length], source:'template',
      why: hint ? 'המהלך הגדול נלקח ממה שכתבת אתמול בערב.' : (goals.length ? 'נבנה מהצעד הבא של היעדים הפעילים שלך.' : 'אין עדיין יעדים פעילים — כדאי להגדיר אחד.')
    };
  },
  ensure(){ const d = Mission.day(); if (!d.mission) { d.mission = Mission.template(); Store.save(); } if (!d.mission.well) { d.mission.well = Mission.pickWell(0); Store.save(); } return d.mission; },
  pickWell(shift){ const n = dayIndex() + shift; const c = n % WELL.length; return { c, i: Math.floor(n / WELL.length + shift * 3) % WELL[c].items.length, shift }; },
  setDone(k, v){
    const d = Mission.day(); d.done[k] = v;
    const amounts = { big:30, p0:10, p1:10, p2:10, habit:10, learn:0, well:10, future:10 };
    const key = 'm:'+dayKey()+':'+k;
    if (v && amounts[k]) XP.award(key, amounts[k]); else if (!v) XP.revoke(key);
  },
  completion(k = dayKey()){
    const d = Store.s.days[k]; if (!d || !d.mission) return null;
    const keys = ['big','p0','p1','p2','habit']; return Math.round(keys.filter(x=>d.done[x]).length / keys.length * 100);
  }
};

/* =========================================================
   AI LAYER — בקשות ל־Claude + הקשר המאמן + כללי בטיחות

const AI = {
  fn: null, ready: false,
  async init(){ try { if (window.claude && claude.use) { AI.fn = await claude.use('sample'); } } catch(e) {} AI.ready = true; },
  get available(){ return !!AI.fn; },
  SAFETY: `כללים:
- כתוב בעברית פשוטה וחמה, בגוף שני.
- אל תבטיח הצלחה, עושר או "שינוי מוח". דבר על התקדמות, עקביות ותוכנית אישית.
- בנושאים רפואיים, נפשיים, פיננסיים או משפטיים: מידע כללי בלבד, והמלצה לפנות לאיש מקצוע כשצריך.
- אתה כלי אימון, לא אדם. אל תעודד תלות בך.
- פעולות קטנות, ספציפיות ומציאותיות לזמן הפנוי של המשתמש.`,
  context(){
    const s = Store.s, p = s.profile || {};
    const goals = Goals.list('active').map(g => ({ יעד:g.title, למה:g.why, דדליין:g.deadline, מצב_נוכחי:g.current, מצב_רצוי:g.desired, התקדמות:Goals.progress(g)+'%', צעד_הבא:g.nextAction, אבני_דרך_פתוחות:g.milestones.filter(m=>!m.done).map(m=>m.t).slice(0,4) }));
    const recent = Object.keys(s.days).sort().slice(-7).map(k => { const d=s.days[k]; return { יום:k, ביצוע:Mission.completion(k), מהלך_גדול:d.mission?.bigMove, הושלם:!!d.done?.big, רפלקציה:d.reflection ? { השלמתי:d.reflection.did, לא_הלך:d.reflection.wrong, להפסיק:d.reflection.stop, מחר:d.reflection.tomorrow } : null }; });
    return JSON.stringify({ משתמש:{ שם:p.name, על_עצמו:p.about, רוצה_לשנות:p.change, למה:p.why, איפה_היום:p.current, לאן:p.desired, דקות_ביום:p.minutes }, יעדים:goals, שבוע_אחרון:recent }, null, 1);
  },
  errorText(e){
    const m = { not_granted:'לא ניתן אישור לשימוש בבינה המלאכותית. אפשר להמשיך עם תבנית.', rate_limited:'יותר מדי בקשות ברגע זה. נסה שוב בעוד דקה.', cancelled:'הבקשה בוטלה.', session_expired:'החיבור פג. רענן את העמוד.', invalid_json:'התשובה לא הגיעה בפורמט הנכון. נסה שוב.' };
    return m[e?.code] || 'משהו השתבש בבקשה. אפשר לנסות שוב או להמשיך בלי בינה מלאכותית.';
  },
  async json(prompt){ return AI.fn.json(prompt + '\n\n' + AI.SAFETY, { modelTier:'default', cache:false }); },
  async text(prompt, onText){ const r = await AI.fn(prompt + '\n\n' + AI.SAFETY, { modelTier:'default', cache:false, onText }); return r.text; }
};

        <div class="check ${on?'done':''}" style="border:none;padding-top:0">${UI.tick(on,'weekly',`data-wk="${wk}"`)}<div class="txt">${esc(w.challenge)}</div></div></div>`; })()}

      <div class="card tint-sky">
        <div class="label">לימוד להיום</div>

  goals(){

  goalNew(){

    return UI.topbar({v: g.id?'goal':'goals', id:g.id, label: g.id?'חזרה ליעד':'היעדים'}) + `

        <label class="field"><span>דדליין</span><input type="date" id="g-deadline" value="${esc(d.deadline)}"></label>
        <label class="field"><span>מצב נוכחי</span><input type="text" id="g-current" value="${esc(d.current)}"></label>
        <label class="field"><span>מצב רצוי</span><input type="text" id="g-desired" value="${esc(d.desired)}"></label>
        <label class="field"><span>אבני דרך</span><textarea id="g-ms" placeholder="אבן דרך בכל שורה">${esc((d.milestones||[]).map(m=>m.t||m).join('\n'))}</textarea><small>כל שורה היא אבן דרך. ההתקדמות מחושבת לפיהן.</small></label>
        <label class="field"><span>הצעד הבא</span><input type="text" id="g-next" value="${esc(d.nextAction)}" placeholder="פעולה אחת שאפשר לעשות היום"></label>
        ${AI.available?`<button class="btn soft block" data-a="goal-ai">✨ פרק לי את היעד לאבני דרך</button><div id="ai-status" class="small muted" style="margin-top:8px"></div>`:''}
      </div>
      <div class="gap"></div><button class="btn primary block" data-a="goal-save">שמירה</button>`;
  },

  goal(){
    const g = Goals.get(View.p.id); if (!g) { View.go('goals'); return ''; }
    const p = Goals.progress(g), dl = Goals.daysLeft(g);
    return UI.topbar({v:'goals', label:'היעדים'}) + `
      <div class="card tint-sage">
        <h1 style="font-size:var(--t-xl);margin-bottom:6px">${esc(g.title)}</h1>
        <div class="small muted" style="margin-bottom:12px">${g.status==='done'?'הושג ✓':(dl===null?'בלי דדליין':(dl<0?'עבר הדדליין':`${dl} ימים לדדליין`))}</div>
        ${UI.bar(p)}<div class="small" style="margin-top:6px">${p}% הושלם</div>
      </div>
      ${g.nextAction?`<div class="card"><div class="label">הצעד הבא</div><div style="font-weight:600">${esc(g.nextAction)}</div></div>`:''}
      <div class="card">
        <div class="card-h"><h2>אבני דרך</h2><span class="small muted">${g.milestones.filter(m=>m.done).length}/${g.milestones.length}</span></div>
        ${g.milestones.length ? g.milestones.map((m,i)=>`<div class="check ${m.done?'done':''}">${UI.tick(m.done,'ms',`data-id="${g.id}" data-i="${i}"`)}<div class="txt">${esc(m.t)}</div></div>`).join('') : '<p class="small muted" style="margin:0">עוד אין אבני דרך. אפשר להוסיף בעריכה.</p>'}
      </div>
      ${g.why||g.current||g.desired?`<div class="card small">
        ${g.why?`<div class="label">למה</div><p style="margin:0 0 10px">${esc(g.why)}</p>`:''}
        ${g.current?`<div class="label">מאיפה</div><p style="margin:0 0 10px">${esc(g.current)}</p>`:''}
        ${g.desired?`<div class="label">לאן</div><p style="margin:0">${esc(g.desired)}</p>`:''}</div>`:''}
      <div class="gap"></div>
      <div class="row-btns"><button class="btn ghost" data-a="go" data-v="goal-new" data-id="${g.id}">עריכה</button><button class="btn ghost" data-a="goal-del" data-id="${g.id}">מחיקה</button></div>`;
  },

  reflect(){
    const d = Mission.day(), r = d.reflection || {}, q = d.mission?.question || EVENING_QS[dayIndex()%EVENING_QS.length];
    const history = Object.keys(Store.s.days).filter(k=>Store.s.days[k].reflection).length;
    return UI.topbar() + `
      <h1 style="font-size:var(--t-2xl);margin-bottom:4px">רפלקציה ערבית</h1>
      <p class="muted small" style="margin:0 0 var(--s4)">10 דקות. כנות עדיפה על שלמות.</p>
      <div class="card tint-peach" style="margin-bottom:var(--s3)"><div class="label">שאלת היום</div><div style="font-weight:500">${esc(q)}</div>
        <label class="field" style="margin:10px 0 0"><textarea id="r-q">${esc(r.q)}</textarea></label></div>
      <div class="card">
        ${REFLECT_QS.map(x=>`<label class="field"><span>${x.q}</span><textarea id="r-${x.k}" style="min-height:64px">${esc(r[x.k])}</textarea></label>`).join('')}
        <button class="btn primary block" data-a="reflect-save">${d.reflection?'עדכון':'שמירה'}</button>
      </div>
      ${AI.available && history>=2 ? `<div class="card tint-sky"><div class="card-h"><h2>דפוסים מהשבוע</h2></div>
        <p class="small muted" style="margin:0 0 10px">ניתוח של הרפלקציות והביצוע בשבוע האחרון.</p>
        <div id="insight">${View.p.insight?`<div class="ai-out">${esc(View.p.insight)}</div>`:''}</div>
        <button class="btn soft block" data-a="insights" style="margin-top:10px">✨ נתח את השבוע</button></div>` : ''}`;
  },

  learn(){
    return UI.topbar() + `<h1 style="font-size:var(--t-2xl);margin-bottom:var(--s4)">ספריית לימוד</h1>` +
      TOPICS.filter(t=>!t.locked).map(t => { const n=t.lessons.filter((_,i)=>Store.s.lessons[t.id+':'+i]).length;
        return `<button class="lrow" data-a="go" data-v="topic" data-id="${t.id}"><div class="t-icon" style="background:var(--${t.color}-soft)">${t.icon}</div>
          <div class="grow"><b>${t.title}</b><div class="small muted">${n}/${t.lessons.length} שיעורים</div><div style="margin-top:8px">${UI.bar(Math.round(n/t.lessons.length*100))}</div></div></button>`; }).join('');
  },

  topic(){
    const t = TOPICS.find(x=>x.id===View.p.id);
    return UI.topbar({v:'learn', label:'הספרייה'}) + `
      <div class="card" style="background:var(--${t.color}-soft);margin-bottom:var(--s4)"><div style="font-size:34px">${t.icon}</div><h1 style="font-size:var(--t-xl)">${t.title}</h1><p class="muted small" style="margin:4px 0 0">${t.desc}</p></div>` +
      t.lessons.map((l,i)=>{ const done=Store.s.lessons[t.id+':'+i];
        return `<button class="lrow" data-a="open-lesson" data-t="${t.id}" data-li="${i}"><div class="num ${done?'on':''}">${done?'✓':i+1}</div><div class="grow"><b>${l.title}</b><div class="small muted">${l.mins} דקות · ${l.quiz.length} שאלות</div></div><span class="muted">‹</span></button>`; }).join('');
  },

  lesson(){
    const t = TOPICS.find(x=>x.id===View.p.id), l = t.lessons[View.p.li], idx = View.p.page;
    const total = l.pages.length + l.quiz.length + 1;
    const steps = `<div class="steps">${Array.from({length:total},(_,i)=>`<i class="${i<=idx?'on':''}"></i>`).join('')}</div>`;
    let body = '';
    if (idx < l.pages.length) {
      const pg = l.pages[idx];
      body = `<div class="card lesson"><h2>${pg.h}</h2>${pg.blocks.map(blockHTML).join('')}</div>
        <div class="gap"></div><div class="row-btns"><button class="btn ghost" data-a="lpage" data-d="-1" ${idx===0?'disabled':''}>הקודם</button><button class="btn primary" data-a="lpage" data-d="1">${idx===l.pages.length-1?'לשאלות':'הבא'}</button></div>`;
    } else if (idx < l.pages.length + l.quiz.length) {
      const qi = idx - l.pages.length, q = l.quiz[qi], ans = View.p.ans;
      body = `<div class="card lesson"><span class="pill ai">שאלה ${qi+1} מתוך ${l.quiz.length}</span><h2 style="margin-top:10px">${q.q}</h2>
        <div class="opts">${q.o.map((o,i)=>`<button class="opt ${ans!=null&&i===q.a?'right':''} ${ans===i&&i!==q.a?'wrong':''}" data-a="quiz" data-i="${i}" ${ans!=null?'disabled':''}>${o}</button>`).join('')}</div>
        ${ans!=null?`<p class="small" style="margin:12px 0 0">${ans===q.a?'<b style="color:var(--good)">נכון!</b>':'<b style="color:var(--bad)">כמעט.</b>'} ${q.why}</p>`:''}</div>
        <div class="gap"></div><button class="btn primary block" data-a="lpage" data-d="1" ${ans==null?'disabled':''}>המשך</button>`;
    } else {
      const next = View.p.li+1 < t.lessons.length;
      body = `<div class="card" style="text-align:center;padding:34px 22px"><div style="font-size:50px">🌿</div><h2>סיימת את השיעור</h2><p class="muted">15 נקודות התקדמות</p></div>
        <div class="gap"></div><div class="row-btns"><button class="btn ghost" data-a="go" data-v="topic" data-id="${t.id}">לרשימה</button>${next?`<button class="btn primary" data-a="open-lesson" data-t="${t.id}" data-li="${View.p.li+1}">לשיעור הבא</button>`:''}</div>`;
    }
    return UI.topbar({v:'topic', id:t.id, label:t.title}) + steps + body;
  }
};

function blockHTML(b){
  switch(b.t){
    case 'lead': return `<div class="lead">${b.v}</div>`;
    case 'p': return `<p>${b.v}</p>`;
    case 'callout': return `<div class="callout"><b>${b.h}</b>${b.v}</div>`;
    case 'ul': return `<ul>${b.v.map(x=>`<li>${x}</li>`).join('')}</ul>`;
    case 'ol': return `<ol>${b.v.map(x=>`<li>${x}</li>`).join('')}</ol>`;
    case 'pre': return `<pre>${b.v}</pre>`;
    case 'table': return `<div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}${b.total?`<tr class="total">${b.total.map(c=>`<td>${c}</td>`).join('')}</tr>`:''}</tbody></table></div>`;
  } return '';
}


/* =========================================================
   ROUTER + ACTIONS
   ========================================================= */
const View = {
  v:'today', p:{},
  go(v, p={}){ View.v=v; View.p=p; render(); window.scrollTo({top:0}); }
};
const NAV_OF = { today:'today', goals:'goals', goal:'goals', 'goal-new':'goals', learn:'learn', topic:'learn', lesson:'learn', reflect:'reflect', modules:'modules', module:'modules' };

function render(){
  const app = document.getElementById('app'), nav = document.getElementById('nav');
  if (!Store.s.profile && View.v !== 'onboarding') View.v = 'onboarding';
  const map = { onboarding:Screens.onboarding, today:Screens.today, goals:Screens.goals, 'goal-new':Screens.goalNew, goal:Screens.goal, reflect:Screens.reflect, learn:Screens.learn, topic:Screens.topic, lesson:Screens.lesson, modules:()=>Screens.modules(), module:()=>Screens.module() };
  app.innerHTML = (map[View.v] || Screens.today)();
  nav.hidden = View.v === 'onboarding';
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === NAV_OF[View.v]));
}

function obCollect(){
  const st = OB_STEPS[View.p.step||0], d = View.p.draft;
  if (st.type==='two'){ d.name=document.getElementById('ob-name').value.trim(); d.about=document.getElementById('ob-about').value.trim(); }
  else if (st.type!=='choice'){ d[st.k]=document.getElementById('ob-v').value.trim(); }
}
function setStatus(t){ const el=document.getElementById('ai-status'); if (el) el.textContent=t; }

const Actions = {
  go: (el) => View.go(el.dataset.v, el.dataset.id ? { id: el.dataset.id } : {}),
  theme(){ const r=document.documentElement; const cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); const n=cur==='dark'?'light':'dark'; r.setAttribute('data-theme',n); try{localStorage.setItem('learn-theme',n)}catch(e){} },

  'ob-pick': (el) => { View.p.draft.minutes = el.dataset.val; render(); },
  'ob-back': () => { obCollect(); View.p.step--; render(); },
  'ob-next': () => {
    obCollect(); const st = OB_STEPS[View.p.step||0], d = View.p.draft;
    const val = st.type==='two' ? d.name : d[st.k];
    if (!val) { toast('רגע, חסרה תשובה'); return; }
    if ((View.p.step||0) < OB_STEPS.length-1) { View.p.step=(View.p.step||0)+1; render(); return; }
    const first = !Store.s.profile;
    Store.s.profile = d;
    if (first) Goals.create({ title:d.change, why:d.why, current:d.current, desired:d.desired });
    Mission.day().mission = null;
    Store.save(); View.go(first ? 'goal' : 'today', first ? { id: Store.s.goals[Store.s.goals.length-1].id } : {});
    if (first) toast('היעד הראשון נוצר. כדאי להוסיף אבני דרך');
  },
  'edit-profile': () => View.go('onboarding', { step:0, draft:Object.assign({}, Store.s.profile) }),

  done: (el) => { const k=el.dataset.k, d=Mission.day(), v=!d.done[k]; Mission.setDone(k, v); Store.save(); render(); if (v && k==='big') toast('המהלך הגדול בוצע! 30 נקודות'); },
  weekly: (el) => { const s = Store.s, wk = el.dataset.wk; s.weekly = s.weekly || {}; s.weekly[wk] = !s.weekly[wk]; if (s.weekly[wk]) { XP.award('wk:'+wk, 25); toast('אתגר השבוע הושלם! 25 נקודות'); } else XP.revoke('wk:'+wk); Store.save(); render(); },
  'well-next': () => { const m = Mission.ensure(); const sh = (m.well.shift || 0) + 1; m.well = Mission.pickWell(sh); Mission.day().done.well = false; XP.revoke('m:'+dayKey()+':well'); Store.save(); render(); },
  'mission-edit': () => { View.p.edit = true; render(); },
  'mission-save': () => {
    const m = Mission.day().mission;
    m.bigMove = document.getElementById('ed-big').value.trim() || m.bigMove;
    m.priorities = [0,1,2].map(i => document.getElementById('ed-p'+i).value.trim() || m.priorities[i]);
    m.habit = document.getElementById('ed-habit').value.trim() || m.habit;
    Store.save(); View.p.edit = false; render();
  },
  'mission-template': (el) => { const d=Mission.day(); if (d.mission && d.mission.source==='ai' && !confirmTap(el)) return; d.mission=Mission.template(); Store.save(); render(); },
  async 'mission-ai'(el){
    el.disabled = true; setStatus('חושב... זה יכול לקחת עד דקה.');
    try {
      const r = await AI.json(Prompts.mission());
      const m = Mission.day().mission;
      if (r.bigMove) m.bigMove = String(r.bigMove);
      if (Array.isArray(r.priorities)) m.priorities = [0,1,2].map(i => String(r.priorities[i] || m.priorities[i]));
      if (r.habit) m.habit = String(r.habit);
      m.why = r.why ? String(r.why) : m.why; m.source = 'ai';
      Store.save(); render(); toast('משימת היום עודכנה');
    } catch(e) { setStatus(AI.errorText(e)); el.disabled = false; }
  },

  'goal-save': () => {
    const v = id => document.getElementById(id).value.trim();
    const title = v('g-title'); if (!title) { toast('חסר שם ליעד'); return; }
    const existing = View.p.id ? Goals.get(View.p.id) : null;
    const lines = v('g-ms').split('\n').map(x=>x.trim()).filter(Boolean);
    const milestones = lines.map(t => ({ t, done: !!existing?.milestones.find(m=>m.t===t && m.done) }));
    const data = { title, why:v('g-why'), deadline:v('g-deadline'), current:v('g-current'), desired:v('g-desired'), milestones, nextAction:v('g-next') };
    let id; if (existing) { Goals.update(existing.id, data); id = existing.id; } else { id = Goals.create(data).id; }
    Store.save(); View.go('goal', { id });
  },
  async 'goal-ai'(el){
    const v = id => document.getElementById(id).value.trim();
    const g = { title:v('g-title'), why:v('g-why'), current:v('g-current'), desired:v('g-desired'), deadline:v('g-deadline') };
    if (!g.title) { toast('קודם כתוב את היעד'); return; }
    el.disabled = true; setStatus('מפרק את היעד...');
    try {
      const r = await AI.json(Prompts.breakGoal(g));
      if (Array.isArray(r.milestones)) document.getElementById('g-ms').value = r.milestones.map(String).join('\n');
      if (r.nextAction) document.getElementById('g-next').value = String(r.nextAction);
      setStatus('הצעה מוכנה. אפשר לערוך לפני שמירה.');
    } catch(e) { setStatus(AI.errorText(e)); }
    el.disabled = false;
  },
  ms: (el) => { Goals.toggleMilestone(el.dataset.id, +el.dataset.i); Store.save(); render(); },
  'goal-del': (el) => { if (!confirmTap(el)) return; Goals.remove(el.dataset.id); Store.save(); View.go('goals'); },

  'reflect-save': () => {
    const d = Mission.day(), r = { q: document.getElementById('r-q').value.trim() };
    REFLECT_QS.forEach(x => r[x.k] = document.getElementById('r-'+x.k).value.trim());

  async insights(el){
    el.disabled = true; const box = document.getElementById('insight'); box.innerHTML = '<div class="ai-out">חושב...</div>';
    try { View.p.insight = await AI.text(Prompts.insights(), ({text}) => { box.firstChild.textContent = text; }); render(); }

  },

  'open-lesson': (el) => View.go('lesson', { id: el.dataset.t, li: +el.dataset.li, page: 0 }),
  lpage: (el) => {
    const t = TOPICS.find(x=>x.id===View.p.id), l = t.lessons[View.p.li];

    if (View.p.page === l.pages.length + l.quiz.length) { Library.complete(t.id, View.p.li); Store.save(); }
    render(); window.scrollTo({top:0});

const Modules = {
  get(id){ return MODULES.find(m => m.id === id); },
  history(id){ const s=Store.s; s.modules = s.modules || {}; return s.modules[id] = s.modules[id] || []; },
  record(id, input, output){ const h = Modules.history(id); h.unshift({ at: Date.now(), input, output }); if (h.length > 8) h.length = 8; XP.award('mod:'+id+':'+dayKey(), 20); },
  addToToday(text){
    if (!text) return false; const m = Mission.ensure(); const d = Mission.day();
    const i = m.priorities.findIndex((_, j) => !d.done['p'+j]); const idx = i < 0 ? 2 : i;
    m.priorities[idx] = text; d.done['p'+idx] = false; return true;
  }
};

function fieldHTML(f, v){
  const val = v ?? (f.type === 'slider' ? 5 : '');
  if (f.type === 'text') return `<label class="field"><span>${f.label}</span><input type="text" id="mf-${f.k}" value="${esc(val)}" placeholder="${esc(f.ph||'')}"></label>`;
  if (f.type === 'area') return `<label class="field"><span>${f.label}</span><textarea id="mf-${f.k}">${esc(val)}</textarea></label>`;
  if (f.type === 'choice') return `<div class="field"><span>${f.label}</span><div class="seg">${f.opts.map(o=>`<button class="seg-b ${val===o?'on':''}" data-a="mf-pick" data-k="${f.k}" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`;
  if (f.type === 'slider') return `<label class="slider"><span>${f.label}</span><input type="range" min="1" max="10" id="mf-${f.k}" value="${val}" data-a2="slide"><b id="mv-${f.k}">${val}</b></label>`;
  return '';
}
function collectFields(mod){
  const f = View.p.form = View.p.form || {};
  mod.fields.forEach(x => { if (x.type !== 'choice') { const el = document.getElementById('mf-'+x.k); if (el) f[x.k] = x.type==='slider' ? +el.value : el.value.trim(); } });
  const missing = mod.fields.find(x => !x.optional && x.type!=='slider' && !f[x.k]);
  return missing ? missing.label : null;
}
function outHTML(text){ return `<div class="ai-out">${esc(text)}</div>`; }

  },

  expert(mod){
    const ex = Store.s.expert, f = View.p.form || (View.p.form = {});
    const LEVELS = ['יסודות','מיומנויות ליבה','יישום מעשי','מתקדם','מומחה'];
    if (!ex || !ex.data) return UI.topbar({v:'modules', label:'כלים'}) + `
      <div class="card" style="background:var(--${mod.color}-soft)"><div style="font-size:32px">${mod.icon}</div><h1 style="font-size:var(--t-xl)">${mod.title}</h1><p class="small" style="margin:6px 0 0">${mod.intro}</p></div>
      <div class="card">${fieldHTML(mod.fields[0], f.skill ?? ex?.skill)}<button class="btn primary block" data-a="ex-start" ${AI.available?'':'disabled'}>✨ התחל את המסלול</button><div id="ai-status" class="small muted" style="margin-top:8px"></div></div>`;
    const d = ex.data, ans = View.p.qa || {};
    const qDone = d.quiz && d.quiz.every((_,i)=>ans[i]!=null);
    const list = (t, arr) => arr && arr.length ? `<div class="label" style="margin-top:14px">${t}</div><ul style="margin:0;padding-right:20px">${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : '';
    return UI.topbar({v:'modules', label:'כלים'}) + `
      <div class="card" style="background:var(--${mod.color}-soft)"><div class="label">${esc(ex.skill)}</div>
        <h1 style="font-size:var(--t-xl)">שלב ${ex.level}: ${LEVELS[ex.level-1]}</h1>
        <div class="steps" style="margin:12px 0 0">${LEVELS.map((_,i)=>`<i class="${i<ex.level?'on':''}"></i>`).join('')}</div></div>
      <div class="card lesson"><div class="label">ידע</div><p style="margin:0">${esc(d.knowledge)}</p>
        ${list('משימות', d.tasks)}${list('פרויקט לשלב', d.project?[d.project]:[])}${list('טעויות נפוצות', d.mistakes)}${list('תובנות של מומחים', d.insights)}${list('קיצורי דרך ומשאבים', d.shortcuts)}</div>
      ${d.quiz?.length ? `<div class="card lesson"><div class="card-h"><h2>מבחן השלב</h2><span class="small muted">${Object.values(ans).filter((a,i)=>a===d.quiz[i]?.a).length}/${d.quiz.length}</span></div>
        ${d.quiz.map((q,qi)=>`<div style="margin-bottom:16px"><b>${qi+1}. ${esc(q.q)}</b><div class="opts">${q.o.map((o,i)=>`<button class="opt ${ans[qi]!=null&&i===q.a?'right':''} ${ans[qi]===i&&i!==q.a?'wrong':''}" data-a="ex-q" data-q="${qi}" data-i="${i}" ${ans[qi]!=null?'disabled':''}>${esc(o)}</button>`).join('')}</div>${ans[qi]!=null?`<p class="small" style="margin:8px 0 0">${esc(q.why)}</p>`:''}</div>`).join('')}</div>` : ''}
      ${d.scenario ? `<div class="card tint-sky"><div class="label">המנטור שואל</div><p style="font-weight:500;margin:0 0 10px">${esc(d.scenario)}</p>
        <label class="field"><span>מה היית עושה?</span><textarea id="ex-ans">${esc(View.p.exAns||'')}</textarea></label>
        <button class="btn soft block" data-a="ex-mentor" ${AI.available?'':'disabled'}>✨ קבל משוב</button>
        <div id="mentor">${View.p.mentor?outHTML(View.p.mentor):''}</div></div>` : ''}
      <div class="gap"></div>
      <div class="row-btns">
        ${ex.level<5?`<button class="btn primary" data-a="ex-next" ${qDone?'':'disabled'}>לשלב הבא</button>`:'<div class="notice">סיימת את כל חמשת השלבים 🎓</div>'}
        <button class="btn ghost" data-a="ex-reset">מיומנות אחרת</button></div>
      ${!qDone && ex.level<5 ? '<p class="small muted">כדי לעבור שלב — ענה על כל שאלות המבחן.</p>' : ''}
      <div id="ai-status" class="small muted" style="margin-top:8px"></div>`;
  }
});

Prompts.expert = (skill, level, prev) => `אתה מומחה עולמי ב"${skill}" ומלמד חניך. בנה את שלב ${level} מתוך 5 (1 יסודות, 2 מיומנויות ליבה, 3 יישום מעשי, 4 מתקדם, 5 מומחה).
${prev ? 'השלב הקודם כיסה: ' + prev : ''}
זמן פנוי ביום: ${Store.s.profile?.minutes || 30} דקות.
החזר JSON בלבד:
{"knowledge":"הסבר מרוכז של מה שחייבים להבין בשלב, 4–6 משפטים","tasks":["3 משימות תרגול"],"project":"פרויקט אחד קטן לשלב","mistakes":["3 טעויות נפוצות"],"insights":["2 תובנות שמומחים יודעים"],"shortcuts":["2–3 קיצורי דרך או סוגי משאבים מומלצים"],"quiz":[{"q":"שאלה","o":["א","ב","ג","ד"],"a":0,"why":"הסבר קצר"}],"scenario":"תרחיש מעשי קצר שמסתיים בשאלה: מה היית עושה?"}
בדיוק 4 שאלות במבחן, התשובה הנכונה במיקומים שונים. עברית בלבד.`;

Object.assign(Actions, {
  'mf-pick': (el) => { const mod = Modules.get(View.p.id); collectFields(mod); View.p.form[el.dataset.k] = el.dataset.val; render(); },
  'mod-show': (el) => { View.p.out = null; View.p.show = +el.dataset.i; render(); },
  async 'mod-run'(el){
    const mod = Modules.get(View.p.id), miss = collectFields(mod);
    if (miss) { toast('חסר: ' + miss); return; }
    const f = Object.assign({}, View.p.form);
    el.disabled = true; setStatus('חושב... זה יכול לקחת עד דקה.');
    try {
      if (mod.kind === 'future') {
        const r = await AI.json(mod.prompt(f)); View.p.fut = r; Modules.record(mod.id, f, JSON.stringify(r)); Store.save(); render(); return;
      }
      const live = document.getElementById('mod-live');
      const out = await AI.text(mod.prompt(f), ({text}) => { live.innerHTML = '<div class="gap"></div>' + outHTML(text); });
      Modules.record(mod.id, f, out); View.p.out = out; View.p.show = null;
      View.p.action = typeof mod.action === 'function' ? mod.action(mod.id==='learning' ? f : out) : '';
      Store.save(); render();
    } catch(e) { setStatus(AI.errorText(e)); el.disabled = false; }
  },
  'mod-today': () => {
    const mod = Modules.get(View.p.id), h = Modules.history(mod.id)[View.p.show ?? 0];
    const text = View.p.action || (mod.action ? mod.action(mod.id==='learning' ? (h?.input||{}) : (h?.output||'')) : '');
    const t = (document.getElementById('mod-act')?.value || text || '').trim();
    if (!t) { toast('כתוב מה להוסיף'); return; }
    if (Modules.addToToday(t)) { Store.save(); toast('נוסף לעדיפויות של היום'); }
  },
  'identity-save': () => { Store.s.identity = View.p.fut || Store.s.identity; Store.save(); render(); toast('הזהות תופיע במסך "היום"'); },

  async 'ex-start'(el){
    const skill = document.getElementById('mf-skill').value.trim(); if (!skill) { toast('כתוב מיומנות'); return; }
    el.disabled = true; setStatus('בונה את שלב 1...');
    try { const d = await AI.json(Prompts.expert(skill, 1)); Store.s.expert = { skill, level:1, data:d }; XP.award('ex:'+skill+':1', 20); Store.save(); View.p.qa = {}; View.p.mentor = null; render(); }
    catch(e) { setStatus(AI.errorText(e)); el.disabled = false; }
  },
  'ex-q': (el) => { View.p.qa = View.p.qa || {}; View.p.qa[+el.dataset.q] = +el.dataset.i; const a = document.getElementById('ex-ans'); if (a) View.p.exAns = a.value; render(); },
  async 'ex-mentor'(el){
    const ans = document.getElementById('ex-ans').value.trim(); if (!ans) { toast('כתוב מה היית עושה'); return; }
    View.p.exAns = ans; el.disabled = true; const box = document.getElementById('mentor'); box.innerHTML = outHTML('חושב...');
    const ex = Store.s.expert;
    try { View.p.mentor = await AI.text(`אתה מנטור ב"${ex.skill}". החניך בשלב ${ex.level}.
תרחיש: ${ex.data.scenario}
תשובת החניך: ${ans}
תן משוב של עד 120 מילים: מה טוב בתשובה, מה חסר, ומה מומחה היה עושה אחרת. סיים בשאלה אחת שתגרום לו לחשוב עמוק יותר. ${FORMAT}`, ({text}) => { box.innerHTML = outHTML(text); }); render(); }
    catch(e) { box.innerHTML = `<div class="notice">${esc(AI.errorText(e))}</div>`; el.disabled = false; }
  },
  async 'ex-next'(el){
    const ex = Store.s.expert; el.disabled = true; setStatus('בונה את השלב הבא...');
    try { const d = await AI.json(Prompts.expert(ex.skill, ex.level+1, ex.data.knowledge)); ex.level++; ex.data = d; XP.award('ex:'+ex.skill+':'+ex.level, 20); Store.save(); View.p.qa = {}; View.p.mentor = null; View.p.exAns=''; render(); window.scrollTo({top:0}); }
    catch(e) { setStatus(AI.errorText(e)); el.disabled = false; }
  },
  'ex-reset': (el) => { if (!confirmTap(el, 'לחץ שוב — ההתקדמות תימחק')) return; Store.s.expert = null; View.p.form = {}; Store.save(); render(); }
});

document.addEventListener('input', e => { if (e.target.dataset.a2 === 'slide') { const b = document.getElementById('mv-' + e.target.id.slice(3)); if (b) b.textContent = e.target.value; } });


/* =========================================================
   TOOL — מגן העושר (בלי בינה מלאכותית)
   ========================================================= */
MODULES.push({ id:'wealth', icon:'🛡️', color:'sky', kind:'wealth', title:'מגן העושר', sub:'המספר האמיתי, שעון 90 יום ומדיניות נתינה', fields:[] });
const nis = n => (Math.round(n)||0).toLocaleString('he-IL') + ' ₪';
Screens.wealth = (mod) => {
  const w = Store.s.wealth = Store.s.wealth || { calc:{}, policy:{}, freeze:'' };
  const c = w.calc, pol = w.policy;
  const real = (+c.amount||0) - (+c.tax||0) - (+c.debt||0) - (+c.family||0) - (+c.reserve||0);
  let freeze = '';
  if (w.freeze) { const left = 90 - Math.floor((new Date(dayKey()) - new Date(w.freeze)) / 86400000);
    freeze = left > 0 ? `<div class="stat" style="box-shadow:none;background:var(--sky-soft)"><b>${left}</b><small>ימים עד שמותר צעד גדול</small></div>` : '<div class="notice">90 הימים עברו. עכשיו אפשר לתכנן צעדים גדולים — בזהירות ובהדרגה.</div>'; }
  const num = (k, l) => `<label class="field"><span>${l}</span><input type="text" inputmode="numeric" id="wc-${k}" value="${esc(c[k]||'')}" data-a2="wcalc"></label>`;
  const txt = (k, l, ph) => `<label class="field"><span>${l}</span><input type="text" id="wp-${k}" value="${esc(pol[k]||'')}" placeholder="${esc(ph)}"></label>`;
  return UI.topbar({v:'modules', label:'כלים'}) + `
    <div class="card" style="background:var(--${mod.color}-soft)"><div style="font-size:32px">${mod.icon}</div><h1 style="font-size:var(--t-xl)">${mod.title}</h1><p class="small" style="margin:6px 0 0">כלים מעשיים מהנושא "הגנה על עושר חדש". מידע כללי בלבד — בסכומים גדולים כדאי ללוות את זה ברואה חשבון ויועץ מורשה.</p></div>
    <div class="card"><div class="card-h"><h2>המספר האמיתי</h2></div>
      ${num('amount','הסכום שהתקבל')}${num('tax','מסים צפויים')}${num('debt','חובות לסגירה')}${num('family','התחייבויות למשפחה')}${num('reserve','כרית ביטחון')}
      <div class="lead" style="margin:0">המספר האמיתי: <b id="w-real">${nis(real)}</b></div></div>
    <div class="card"><div class="card-h"><h2>שעון 90 יום</h2></div>
      <p class="small muted" style="margin:0 0 10px">בלי רכב חדש, עזיבת עבודה, מעבר דירה או השקעות אקראיות עד שהשעון מסתיים.</p>
      ${freeze}<div class="gap"></div><button class="btn soft block" data-a="w-freeze">${w.freeze?'להתחיל את הספירה מחדש':'להתחיל ספירה מהיום'}</button></div>
    <div class="card"><div class="card-h"><h2>מדיניות הנתינה שלי</h2></div>
      ${txt('who','למי אני נותן?','למשל: הורים, אחים, צדקה אחת קבועה')}
      ${txt('amount','כמה?','למשל: עד 5% בשנה, או סכום קבוע')}
      ${txt('freq','באיזו תדירות?','למשל: פעם ברבעון')}
      <div class="field"><span>הלוואה או מתנה?</span><div class="seg">${['מתנה','הלוואה','תלוי במקרה'].map(o=>`<button class="seg-b ${pol.type===o?'on':''}" data-a="wp-pick" data-k="type" data-val="${o}">${o}</button>`).join('')}</div></div>
      <div class="field"><span>פרטי או פומבי?</span><div class="seg">${['פרטי','פומבי'].map(o=>`<button class="seg-b ${pol.pub===o?'on':''}" data-a="wp-pick" data-k="pub" data-val="${o}">${o}</button>`).join('')}</div></div>
      ${txt('line','המשפט שלי לבקשות','למשל: "אני צריך לבדוק ואחזור אליך"')}
      <button class="btn primary block" data-a="w-save">שמירת המדיניות</button></div>`;
};
const _module = Screens.module;
Screens.module = () => { const m = Modules.get(View.p.id); return m && m.kind === 'wealth' ? Screens.wealth(m) : _module(); };
function wCollect(){ const w = Store.s.wealth; ['who','amount','freq','line'].forEach(k => { const el = document.getElementById('wp-'+k); if (el) w.policy[k] = el.value.trim(); }); }
Object.assign(Actions, {
  'w-freeze': (el) => { const w = Store.s.wealth; if (w.freeze && !confirmTap(el)) return; w.freeze = dayKey(); Store.save(); render(); },
  'wp-pick': (el) => { wCollect(); Store.s.wealth.policy[el.dataset.k] = el.dataset.val; Store.save(); render(); },
  'w-save': () => { wCollect(); XP.award('wealth:policy', 20); Store.save(); toast('המדיניות נשמרה'); }
});
document.addEventListener('input', e => {
  if (e.target.dataset.a2 !== 'wcalc') return;
  const w = Store.s.wealth, k = e.target.id.slice(3); w.calc[k] = e.target.value.replace(/[^\d.]/g,'');
  const c = w.calc, real = (+c.amount||0) - (+c.tax||0) - (+c.debt||0) - (+c.family||0) - (+c.reserve||0);
  const out = document.getElementById('w-real'); if (out) out.textContent = nis(real);
  clearTimeout(wCollect._t); wCollect._t = setTimeout(() => Store.save(), 600);
});

/* =========================================================
   BOOT
   ========================================================= */
try { const th = localStorage.getItem('learn-theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch(e) {}
Store.loadLocal();
View.v = Store.s.profile ? 'today' : 'onboarding';
render();
const safeToRender = () => (View.v === 'today' && !View.p.edit) || ['goals','goal','learn','topic','modules'].includes(View.v);
Store.connect(() => { if (View.v === 'onboarding' && Store.s.profile) { View.go('today'); return; } if (safeToRender()) render(); });
AI.init().then(() => { if (safeToRender()) render(); });
</script>
</body>
</html>
